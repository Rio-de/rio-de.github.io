	<iframe width="655" height="369" src="https://www.youtube.com/embed/xWpV2Nmu7b4" title="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    <script>
        function updateTime() {
            var now = new Date();
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            var clockPlaceholder = document.getElementById("clock-placeholder");

            // 数値が1桁の場合、前に0を付ける
            hours = hours < 10 ? "0" + hours : hours;
            minutes = minutes < 10 ? "0" + minutes : minutes;
            seconds = seconds < 10 ? "0" + seconds : seconds;

            // 時刻の表示
            clockPlaceholder.textContent = hours + ":" + minutes + ":" + seconds;

            // 次の再描画イベント時に再度呼び出す
            requestAnimationFrame(updateTime);
        }

        function updateDate() {
            var now = new Date();
            var days = ['日', '月', '火', '水', '木', '金', '土'];
            var month = now.getMonth() + 1;
            var date = now.getDate();
            var dayOfWeek = days[now.getDay()];
            var clockDatePlaceholder = document.getElementById("clock-date");

            // 日付の表示
            var formattedDate = month + "月" + date + "日 " + dayOfWeek + "曜日";
            clockDatePlaceholder.textContent = formattedDate;

            // 次の再描画イベント時に再度呼び出す
            requestAnimationFrame(updateDate);
        }

        // 初回呼び出し
        updateTime();
        updateDate();
    </script>
</body>

	<script>//タイマー
        function updateTaskTime() {
			// 現在の日付を取得
			var currentDate = new Date();
			var currentYear = currentDate.getFullYear();
			var currentMonth = currentDate.getMonth() + 1;
			var currentDay = currentDate.getDate();
			
            var yearSelect = document.getElementById("Dyy_slc");
			var monthSelect = document.getElementById("Dmm_slc");
			var daySelect = document.getElementById("Ddd_slc");
			var hourSelect = document.getElementById("Dhh_slc");
			var minuteTensSelect = document.getElementById("Dmn1_slc");
			var minuteOnesSelect = document.getElementById("Dmn2_slc");
            var taskTimePlaceholder = document.getElementById("task-time-placeholder");
            var taskListPlaceholder = document.getElementById("task-list-placeholder");
            var endTimePlaceholder = document.getElementById("end-time");
            var progressBar = document.getElementById("progress-bar");

            // 入力された日付と時刻を取得
			var year = yearSelect.value;
			var month = monthSelect.value;
			var day = daySelect.value;
			var hour = hourSelect.value;
			var minuteTens = minuteTensSelect.value;
			var minuteOnes = minuteOnesSelect.value;
	
            // 日付と時刻を組み合わせて目標時刻を取得			
			var selectedDate = new Date(year, month - 1, day);
			var targetTime = new Date(selectedDate);
				targetTime.setHours(hour);
				targetTime.setMinutes(minuteTens + minuteOnes);
				
			// selectedDateが空の場合は、本日の23:59:59を設定
			if (year !== currentYear || month !== currentMonth || day !== currentDay || hour !== defaultHour || minuteTens !== defaultMinuteTens || minuteOnes !== defaultMinuteOnes) {
						
				// 残り時間と総時間の計算
				var remainingTime = calculateRemainingTime(targetTime);
				var totalTime = calculateTotalTime(targetTime);

				// 表示更新
				taskTimePlaceholder.textContent = formatTime(remainingTime.hours) + ":" + formatTime(remainingTime.minutes) + ":" + formatTime(remainingTime.seconds);
				taskListPlaceholder.innerHTML = "";

				// 終了予定時刻の表示
				var endDateTime = new Date(targetTime);
				endTimePlaceholder.textContent = formatTime(endDateTime.getHours()) + ":" + formatTime(endDateTime.getMinutes()) + ":" + formatTime(endDateTime.getSeconds());

				// シークバーの制御
				var currentTime = new Date();
				var elapsedTime = totalTime - remainingTime.hours * 3600 * 1000 - remainingTime.minutes * 60 * 1000 - remainingTime.seconds * 1000;
				var progressPercentage = (elapsedTime / totalTime) * 100;
				progressBar.style.width = progressPercentage + "%";
            }
			
			// タイマーの時間に応じて再度呼び出す
            setTimeout(updateTaskTime, 1000);
        }

        function calculateRemainingTime(targetTime) {
            var currentTime = new Date();

            var timeDiff = Math.abs(targetTime - currentTime) / 1000; // in seconds
            var hours = Math.floor(timeDiff / 3600);
            var minutes = Math.floor((timeDiff % 3600) / 60);
            var seconds = Math.floor(timeDiff % 60);

            return { hours: hours, minutes: minutes, seconds: seconds };
        }

        function calculateTotalTime(targetTime) {
            var lastUpdateTime = new Date(); // You may need to replace this with the actual last update time
            var timeDiff = Math.abs(targetTime - lastUpdateTime) / 1000; // in seconds
            var hours = Math.floor(timeDiff / 3600);
            var minutes = Math.floor((timeDiff % 3600) / 60);
            var seconds = Math.floor(timeDiff % 60);

            return { hours: hours, minutes: minutes, seconds: seconds };
        }

        function formatTime(time) {
            return time < 10 ? "0" + time : time;
        }

        // 初回呼び出し
        updateTaskTime();
    </script>
	<script>//ストップウォッチ
		var stopwatchRunning = false;
		var stopwatchStartTime = 0;
		var stopwatchInterval;

		function startStopwatch() {
			if (!stopwatchRunning) {
				stopwatchRunning = true;
				stopwatchStartTime = Date.now() - (stopwatchStartTime || 0);
				stopwatchInterval = setInterval(updateStopwatchTime, 1000);
				document.getElementById("start-stopwatch-btn").textContent = "Stop";
			} else {
				stopwatchRunning = false;
				clearInterval(stopwatchInterval);
				document.getElementById("start-stopwatch-btn").textContent = "Start";
			}
		}

		function resetStopwatch() {
				stopwatchRunning = false;
				clearInterval(stopwatchInterval);
				stopwatchStartTime = 0; // Reset stopwatch start time
				updateStopwatchTime(); // Update stopwatch display
				document.getElementById("start-stopwatch-btn").textContent = "Start";
		}

		function updateStopwatchTime() {
			var currentTime = stopwatchStartTime ? Date.now() - stopwatchStartTime : 0;
			var hours = Math.floor(currentTime / (1000 * 60 * 60));
			var minutes = Math.floor((currentTime % (1000 * 60 * 60)) / (1000 * 60));
			var seconds = Math.floor((currentTime % (1000 * 60)) / 1000);

			document.getElementById("stopwatch-time-placeholder").textContent = formatTime(hours) + ":" + formatTime(minutes) + ":" + formatTime(seconds);
		}

		function formatTime(time) {
			return time < 10 ? "0" + time : time;
		}

		// 初期化
		updateStopwatchTime();
	</script>
